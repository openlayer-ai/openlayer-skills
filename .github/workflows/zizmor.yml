---
name: Check GitHub Actions

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  merge_group:
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  zizmor:
    name: Check GitHub Actions security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          # advanced-security uploads SARIF to GitHub code-scanning, which requires
          # GitHub Advanced Security. This repo is private without GHAS, so keep it
          # off — zizmor still runs and fails the job on findings (min-severity low).
          advanced-security: false
          min-severity: low
